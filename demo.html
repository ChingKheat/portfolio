<!DOCTYPE html>
<html lang="en" data-theme="dark">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title id="demo-page-title">Project Live Demo</title>
  <link rel="stylesheet" href="css/style.css?v=5.0">
  <style>
    /* Demo Page Specific Styles */
    body {
      overflow: hidden;
      height: 100vh;
      display: flex;
      flex-direction: column;
      background: #0b0f17;
    }

    .demo-navbar {
      height: 60px;
      background: var(--bg-surface);
      border-bottom: 1px solid var(--border-color);
      display: flex;
      align-items: center;
      justify-content: space-between;
      padding: 0 1.25rem;
      z-index: 100;
      flex-shrink: 0;
    }

    .demo-nav-left {
      display: flex;
      align-items: center;
      gap: 1rem;
    }

    .back-btn {
      display: inline-flex;
      align-items: center;
      gap: 0.5rem;
      color: var(--text-main);
      font-weight: 600;
      font-size: 0.9rem;
      padding: 0.45rem 0.85rem;
      border-radius: var(--radius-md);
      background: var(--bg-surface-elevated);
      border: 1px solid var(--border-color);
      transition: all var(--transition-fast);
    }

    .back-btn:hover {
      background: var(--accent-primary);
      color: #ffffff;
      border-color: var(--accent-primary);
    }

    .demo-title-info {
      display: flex;
      align-items: center;
      gap: 0.65rem;
    }

    .demo-title-info h1 {
      font-size: 1.1rem;
      font-weight: 700;
      color: var(--text-main);
      margin: 0;
    }

    .demo-nav-right {
      display: flex;
      align-items: center;
      gap: 0.75rem;
    }

    .demo-viewport-container {
      flex: 1;
      width: 100%;
      height: calc(100vh - 60px);
      position: relative;
      background: #000000;
      display: flex;
      align-items: center;
      justify-content: center;
      overflow: hidden;
    }

    .demo-iframe {
      width: 100%;
      height: 100%;
      border: none;
      display: block;
      background: #ffffff;
    }

    /* Mobile wrapper mode */
    .mobile-frame-container {
      width: 410px;
      height: 92%;
      max-height: 840px;
      border-radius: 40px;
      overflow: hidden;
      box-shadow: 0 25px 60px rgba(0, 0, 0, 0.8), 0 0 0 10px #1e2634;
      border: 4px solid #000000;
      background: #ffffff;
      position: relative;
    }

    .mobile-frame-container iframe {
      width: 100%;
      height: 100%;
      border: none;
    }

    /* Standby fallback */
    .no-demo-message {
      text-align: center;
      padding: 3rem 1.5rem;
      max-width: 550px;
      background: var(--bg-surface);
      border: 1px solid var(--border-color);
      border-radius: var(--radius-xl);
      color: var(--text-main);
    }
  </style>
</head>
<body>

  <!-- Top Navigation Bar -->
  <nav class="demo-navbar">
    <div class="demo-nav-left">
      <a href="index.html" class="back-btn" title="Return to Projects Explorer">
        <svg width="16" height="16" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2.5">
          <line x1="19" y1="12" x2="5" y2="12"></line>
          <polyline points="12 19 5 12 12 5"></polyline>
        </svg>
        &larr; Back to Projects
      </a>
      <div class="demo-title-info">
        <h1 id="nav-project-title">Loading Project...</h1>
        <span id="nav-badge" class="badge-pill" style="display:none;"></span>
      </div>
    </div>

    <div class="demo-nav-right">
      <!-- Device frame toggle for mobile apps -->
      <div id="device-toggle-wrapper" class="device-switcher" style="display:none;">
        <button id="toggle-phone-btn" class="device-btn active" title="View as Phone Mockup">
          📱 Phone
        </button>
        <button id="toggle-full-btn" class="device-btn" title="View Fullscreen Window">
          💻 Full Width
        </button>
      </div>

      <!-- External Links -->
      <a id="open-direct-link" href="#" target="_blank" rel="noopener" class="btn-primary" style="font-size:0.85rem; padding:0.4rem 0.85rem;">
        Open Standalone &rarr;
      </a>
      <a id="view-github-link" href="#" target="_blank" rel="noopener" class="btn-secondary" style="font-size:0.85rem; padding:0.4rem 0.85rem;">
        GitHub Code
      </a>
    </div>
  </nav>

  <!-- Live Demo Viewport -->
  <main class="demo-viewport-container" id="demo-viewport-container">
    <div id="demo-loading" style="color:var(--text-muted); font-size:1.1rem; display:flex; align-items:center; gap:0.5rem;">
      <span class="pulse-dot"></span> Loading live application...
    </div>
  </main>

  <!-- Scripts -->
  <script src="js/github-api.js?v=8.0"></script>
  <script src="js/config-manager.js?v=8.0"></script>
  <script src="js/demo.js?v=8.0"></script>
</body>
</html>
